name: Immutable release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main commit to release
        required: true
        type: string
      release_version:
        description: New unused semantic version; never reuse a failed tag
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      GH_TOKEN: ${{ github.token }}
      CROSS_PROJECT_REQUIRED_GATES: 0
    steps:
      - name: Checkout exact merged commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Bind release subject and refuse reuse
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            0.*.*) ;;
            *) echo 'release_version must be a 0.x.y version' >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          RELEASE_TAG="v$RELEASE_VERSION"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to reuse existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          response_file=$(mktemp)
          set +e
          release_status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          curl_status=$?
          set -e
          rm -f "$response_file"
          test "$curl_status" -eq 0
          test "$release_status" = 404

      - name: Re-run conformance and end-to-end example
        run: |
          set -euo pipefail
          mkdir -p .ci/bin
          ./scripts/measure-command.sh .ci/timing/compile.json -- go test -run '^$' ./...
          ./scripts/measure-command.sh .ci/timing/build.json -- go build -trimpath -o .ci/bin/gooo-confluence ./cmd/gooo-confluence
          go build -trimpath -o .ci/bin/gooo-verify ./cmd/gooo-verify
          ./scripts/measure-command.sh .ci/timing/test.json -- go test ./...
          ./scripts/measure-command.sh .ci/timing/conformance.json -- bash ./scripts/conformance.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" .ci/bin/gooo-confluence .ci/bin/gooo-verify
          ./scripts/measure-command.sh .ci/timing/integration.json -- bash ./scripts/integration.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" .ci/bin/gooo-confluence .ci/bin/gooo-verify
          ./scripts/write-metrics.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/ci-metrics.json"
          jq -e '.tests.failed == 0 and .tests.total == 9 and .counts.normal == 3 and .counts.unknown == 3 and .counts.refuted == 3' .ci/conformance-report.json >/dev/null
          jq -e '.merge_authority == 0 and (.execution | type == "string")' .ci/integration-report.json >/dev/null

      - name: Assemble immutable release assets
        run: |
          set -euo pipefail
          mkdir -p .ci/release
          source_name="gooo-semantic-change-confluence-source-v${RELEASE_VERSION}.tar.gz"
          binary_name="gooo-semantic-change-confluence-linux-amd64-v${RELEASE_VERSION}.tar.gz"
          report_name="release-report-v${RELEASE_VERSION}.json"
          report_md_name="release-report-v${RELEASE_VERSION}.md"
          manifest_name="release-manifest-v${RELEASE_VERSION}.json"
          git archive --format=tar.gz --prefix="gooo-semantic-change-confluence-v${RELEASE_VERSION}/" "$EXPECTED_SHA" > ".ci/release/$source_name"
          tar -czf ".ci/release/$binary_name" -C .ci/bin gooo-confluence gooo-verify
          jq -n --arg schema "gooo/semantic-confluence-release-report/v1" --arg version "$RELEASE_VERSION" --arg tag "v$RELEASE_VERSION" --arg commit "$EXPECTED_SHA" \
            --slurpfile conformance .ci/conformance-report.json --slurpfile integration .ci/integration-report.json \
            --slurpfile metrics .ci/ci-metrics.json \
            '{schema:$schema,version:$version,tag:$tag,commit:$commit,language:"Gooo",scope:"parallel semantic change confluence",cross_project_required_gates:0,merge_authority:0,conformance:$conformance[0],integration:$integration[0],metrics:$metrics[0],external_utility:"UNKNOWN"}' \
            > ".ci/release/$report_name"
          cp .ci/conformance-report.md ".ci/release/$report_md_name"
          jq -n --arg schema "gooo/semantic-confluence-release/v1" --arg version "$RELEASE_VERSION" --arg tag "v$RELEASE_VERSION" --arg commit "$EXPECTED_SHA" \
            --arg source_name "$source_name" --arg source_digest "sha256:$(sha256sum ".ci/release/$source_name" | awk '{print $1}')" \
            --arg binary_name "$binary_name" --arg binary_digest "sha256:$(sha256sum ".ci/release/$binary_name" | awk '{print $1}')" \
            --arg report_name "$report_name" --arg report_digest "sha256:$(sha256sum ".ci/release/$report_name" | awk '{print $1}')" \
            --arg report_md_name "$report_md_name" --arg report_md_digest "sha256:$(sha256sum ".ci/release/$report_md_name" | awk '{print $1}')" \
            '{schema:$schema,version:$version,tag:$tag,commit:$commit,assets:[{name:$source_name,digest:$source_digest},{name:$binary_name,digest:$binary_digest},{name:$report_name,digest:$report_digest},{name:$report_md_name,digest:$report_md_digest}]}' \
            > ".ci/release/$manifest_name"
          (cd .ci/release && sha256sum "$source_name" "$binary_name" "$report_name" "$report_md_name" "$manifest_name" > SHA256SUMS)
          (cd .ci/release && sha256sum -c SHA256SUMS)
          jq -n --arg source_name "$source_name" --arg source_digest "sha256:$(sha256sum ".ci/release/$source_name" | awk '{print $1}')" --argjson source_size "$(stat -c '%s' ".ci/release/$source_name")" \
            --arg binary_name "$binary_name" --arg binary_digest "sha256:$(sha256sum ".ci/release/$binary_name" | awk '{print $1}')" --argjson binary_size "$(stat -c '%s' ".ci/release/$binary_name")" \
            --arg report_name "$report_name" --arg report_digest "sha256:$(sha256sum ".ci/release/$report_name" | awk '{print $1}')" --argjson report_size "$(stat -c '%s' ".ci/release/$report_name")" \
            --arg report_md_name "$report_md_name" --arg report_md_digest "sha256:$(sha256sum ".ci/release/$report_md_name" | awk '{print $1}')" --argjson report_md_size "$(stat -c '%s' ".ci/release/$report_md_name")" \
            --arg manifest_name "$manifest_name" --arg manifest_digest "sha256:$(sha256sum ".ci/release/$manifest_name" | awk '{print $1}')" --argjson manifest_size "$(stat -c '%s' ".ci/release/$manifest_name")" \
            --arg sums_digest "sha256:$(sha256sum .ci/release/SHA256SUMS | awk '{print $1}')" --argjson sums_size "$(stat -c '%s' .ci/release/SHA256SUMS)" \
            '[{name:$source_name,size:$source_size,digest:$source_digest},{name:$binary_name,size:$binary_size,digest:$binary_digest},{name:$report_name,size:$report_size,digest:$report_digest},{name:$report_md_name,size:$report_md_size,digest:$report_md_digest},{name:$manifest_name,size:$manifest_size,digest:$manifest_digest},{name:"SHA256SUMS",size:$sums_size,digest:$sums_digest}] | sort_by(.name)' > .ci/expected-release-assets.json

      - name: Create annotated tag exactly once
        run: |
          set -euo pipefail
          RELEASE_TAG="v$RELEASE_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$EXPECTED_SHA" -m "gooo-semantic-change-confluence $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          jq -e --arg expected "$EXPECTED_SHA" '.object.type == "commit" and .object.sha == $expected' <<<"$tag_body" >/dev/null
          echo "tag_object=$tag_object" >> "$GITHUB_ENV"

      - name: Publish release exactly once
        run: |
          set -euo pipefail
          RELEASE_TAG="v$RELEASE_VERSION"
          gh release create "$RELEASE_TAG" --verify-tag --title "gooo-semantic-change-confluence $RELEASE_TAG" \
            --notes 'Immutable evidence-bounded release. merge_authority=0; external utility remains UNKNOWN.' \
            .ci/release/*

      - name: Verify immutable release and every asset
        run: |
          set -euo pipefail
          RELEASE_TAG="v$RELEASE_VERSION"
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" --slurpfile expected .ci/expected-release-assets.json '
            .draft == false and .prerelease == false and .immutable == true and .tag_name == $tag and
            ([.assets[] | {name,size,digest}] | sort_by(.name)) == ($expected[0] | sort_by(.name))
          ' <<<"$release_json" >/dev/null
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          tag_object=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          jq -e --arg expected "$EXPECTED_SHA" '.object.type == "commit" and .object.sha == $expected' <<<"$tag_body" >/dev/null

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-confluence-release-${{ github.sha }}
          path: .ci
          include-hidden-files: true
