name: Conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CROSS_PROJECT_REQUIRED_GATES: 0
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Verify declared semantic contract
        run: |
          set -euo pipefail
          jq -e '.language == "Gooo" and .cross_project_required_gates == 0 and .authorities.merge_authority == 0 and .authorities.runtime_write == 0 and .reduction_order == ["REFUTED", "UNKNOWN", "CLOSED"] and (.canonical_cases | length == 9)' .gooo/confluence.gooo >/dev/null

      - name: Compile packages and measure
        run: ./scripts/measure-command.sh .ci/timing/compile.json -- go test -run '^$' ./...

      - name: Build evaluator and independent verifier
        run: |
          set -euo pipefail
          mkdir -p .ci/bin
          ./scripts/measure-command.sh .ci/timing/build.json -- go build -trimpath -o .ci/bin/gooo-confluence ./cmd/gooo-confluence
          go build -trimpath -o .ci/bin/gooo-verify ./cmd/gooo-verify

      - name: Run Go tests and measure
        run: ./scripts/measure-command.sh .ci/timing/test.json -- go test ./...

      - name: Run nine canonical cases and measure
        run: ./scripts/measure-command.sh .ci/timing/conformance.json -- bash ./scripts/conformance.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/bin/gooo-confluence" "$GITHUB_WORKSPACE/.ci/bin/gooo-verify"

      - name: Execute generated artifact end to end and measure
        run: ./scripts/measure-command.sh .ci/timing/integration.json -- bash ./scripts/integration.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/bin/gooo-confluence" "$GITHUB_WORKSPACE/.ci/bin/gooo-verify"

      - name: Write exact integer evidence
        run: ./scripts/write-metrics.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/ci-metrics.json"

      - name: Assert evidence completeness
        run: |
          set -euo pipefail
          jq -e '
            (.inventory.go_files | type == "number" and floor == .) and
            (.inventory.gooo_files | type == "number" and floor == .) and
            (.inventory.go_physical_lines | type == "number" and floor == .) and
            (.inventory.gooo_physical_lines | type == "number" and floor == .) and
            (.inventory.regular_files | type == "number" and floor == .) and
            (.inventory.files_total | type == "number" and floor == .) and
            (.inventory.subdirectories | type == "number" and floor == .) and
            (.inventory.root_readme_inventory_excluded == 1) and
            (.outputs.count | type == "number" and floor == .) and
            (.outputs.bytes | type == "number" and floor == .) and
            (.generated_artifacts.count | type == "number" and floor == .) and
            (.generated_artifacts.bytes | type == "number" and floor == .) and
            (.wall_ms.compile | type == "number" and floor == .) and
            (.wall_ms.build | type == "number" and floor == .) and
            (.wall_ms.test | type == "number" and floor == .) and
            (.wall_ms.conformance | type == "number" and floor == .) and
            (.wall_ms.integration | type == "number" and floor == .) and
            (.resources.peak_rss_kib.compile | type == "number" and floor == .) and
            (.resources.peak_rss_kib.build | type == "number" and floor == .) and
            (.resources.peak_rss_kib.test | type == "number" and floor == .) and
            (.resources.peak_rss_kib.conformance | type == "number" and floor == .) and
            (.resources.peak_rss_kib.integration | type == "number" and floor == .) and
            (.tests.total == 9 and .tests.selected == 9 and .tests.executed == 9 and .tests.reused == 0 and .tests.failed == 0 and .tests.unknown == 3) and
            (.canonical.normal == 3 and .canonical.closed == 3 and .canonical.unknown == 3 and .canonical.refuted == 3) and
            (.local_validation_commands == 0) and
            (.operational_refutation == "OPERATIONAL_REFUTED") and
            (.authority_counts.local == 0 and .authority_counts.remote == 1 and .authority_counts.runtime_write == 0 and .authority_counts.merge_authority == 0)
          ' .ci/ci-metrics.json

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-confluence-${{ github.sha }}
          path: .ci
          include-hidden-files: true
